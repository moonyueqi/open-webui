# ===============================================================
# 雷达推送服务（radar-push）独立 compose stack。
# 与 fengche / OpenWebUI 完全解耦。
#
# 部署（在 radar_push/deploy/ 目录内）：
#   1. cp .env.example .env   并填好 SFTP_PASSWORD 与 WECOM_WEBHOOK_URL
#   2. docker compose --env-file .env up -d --build
#
# 构建上下文为 ..（radar_push/），Dockerfile 在 radar_push/Dockerfile。
# 数据走 SFTP 远程拉取，无需挂载数据目录；仅挂载 state 持久化去重状态。
# ===============================================================

services:
  radar-push:
    build:
      context: ..
      dockerfile: Dockerfile
    image: radar-push:latest
    container_name: radar-push
    restart: unless-stopped
    # host 网络模式：容器直接用宿主机网络栈，不依赖 docker 的 iptables 转发规则。
    # 避免 firewalld reload/restart 冲掉 docker FORWARD 规则导致容器全部断网的问题。
    # 注意：host 模式下 ports 映射失效，服务直接监听宿主机 8770 端口。
    network_mode: host
    env_file:
      - .env
    volumes:
      - ../state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8770/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
