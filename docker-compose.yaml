services:
  leadsee-webui:
    # === 内网部署说明 ===
    # 构建机（有外网，Windows/Linux 均可）：
    #   docker compose build
    #   docker save leadsee-webui:local -o leadsee-webui.tar
    #   # （可选，仅 Linux 构建机）压缩可省 50%+ 体积：
    #   #   docker save leadsee-webui:local | zstd -19 > leadsee-webui.tar.zst
    # 部署机（纯内网，Ubuntu）：
    #   docker load -i leadsee-webui.tar
    #   # 若收到 .tar.zst：zstd -d leadsee-webui.tar.zst -c | docker load
    #   docker compose up -d
    # 注意：内网部署机不要执行 `docker compose build`（拉不到国内镜像源）
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CUDA: "false"
        USE_OLLAMA: "false"
        # 全部走外部 API（OpenAI 等），不需要把本地 RAG/Whisper/tiktoken 模型烘焙进镜像
        # 可省下 ~300MB 镜像体积，并避免构建期访问 huggingface.co / openaipublic.blob.core.windows.net / raw.githubusercontent.com
        USE_SLIM: "true"
    image: leadsee-webui:${WEBUI_DOCKER_TAG:-local}
    container_name: leadsee-webui
    volumes:
      - leadsee-webui:/app/backend/data
      # === 业务数据挂载（可选）===
      # 1) 模板：镜像里已烘焙到 /app/weather_templates，正常无需挂载。
      #    若运维想在不重建镜像的情况下临时改模板，把宿主机目录挂上来即可覆盖：
      # - ./weather_templates:/app/weather_templates:ro
      #
      # 2) BJ-240 XML 本地后备目录：仅在 BJ240_SOURCE_MODE=local 时生效。
      #    默认是 ftp 模式，不需要挂这个；保留示例方便联调。
      # - /opt/leadsee/BJ-240:/app/data/BJ-240:ro
      #
      # 3) 公报 .doc 本地后备目录：仅在 BULLETIN_SOURCE_MODE=local 时生效。
      #    默认 ftp 模式不挂这个。
      # - ./bulletin:/app/data/bulletin:ro
      #
      # 4) weather_pics：generate_forecast_from_folder 工具使用。
      #    上传/同步图片到宿主机这个目录，容器即可读到。
      #    dev-bj 沿用旧路径 /app/data/weather_pics + WEATHER_PICS_ROOT，
      #    暂不切换到 common 的 /pic_data + WEATHER_DATA_ROOT，避免与
      #    现存 tools/*.py 里硬编码的路径冲突。
      - ${WEATHER_PICS_HOST_DIR:-./weather_pics}:/app/data/weather_pics:ro
      #
      # 5) 监测预警数据：FTP 实时推送落地目录，结构为
      #    年(4)/月(2)/日(2)/单位/产品/文件名，目录按需创建（当天没预警就没有对应目录）。
      #    宿主机路径按实际部署改，例如 /data/AIuser。
      # - ${MONITORING_DATA_HOST_DIR:-/data/AIuser}:/app/data/alarm:ro
    ports:
      - ${OPEN_WEBUI_PORT:-3000}:8080
    # === 从 .env 加载完整业务配置 ===
    # 部署时把 .env.intranet.example 复制为 .env 并填写真实值
    # env_file 中的变量优先级低于下面 environment 段（compose 规则）
    env_file:
      - .env
    # === 不可被 .env 覆盖的固定配置 ===
    # 这些是基础设施级开关，不应该让 .env 误改
    environment:
      - UVICORN_WORKERS=1
      # === 容器时区（定时任务/日历提醒必需）===
      # automation_worker_loop 和 calendar_alert_worker_loop 都依赖 zoneinfo
      # 计算"墙钟时间"，容器默认 UTC 会让 "每天 9 点" 在北京时间下午 5 点才触发。
      # 镜像层已经设置过 TZ=Asia/Shanghai，这里再显式声明便于运维按需覆盖。
      - TZ=Asia/Shanghai
      # 启动 .webui_secret_key 文件的兜底逻辑由 start.sh 处理；
      # 强烈建议在 .env 里显式设置 WEBUI_SECRET_KEY（openssl rand -hex 32）
      #
      # === 天气工具默认配置（值从 .env 注入，这里只是声明给容器看见） ===
      # BJ-240 XML 数据源：ftp（默认）/ local
      - BJ240_SOURCE_MODE=${BJ240_SOURCE_MODE:-ftp}
      - BJ240_FTP_HOST=${BJ240_FTP_HOST:-10.225.3.71}
      - BJ240_FTP_PORT=${BJ240_FTP_PORT:-21}
      - BJ240_FTP_USER=${BJ240_FTP_USER:-FtpFiles}
      - BJ240_FTP_PASSWORD=${BJ240_FTP_PASSWORD:-}
      - BJ240_FTP_DIR=${BJ240_FTP_DIR:-/cpzz/tqgb-12}
      - BJ240_FTP_TIMEOUT=${BJ240_FTP_TIMEOUT:-30}
      - BJ240_LOCAL_DIR=${BJ240_LOCAL_DIR:-/app/data/BJ-240}
      # 公报 .doc 数据源（FTP 账号复用 BJ240_FTP_* 那一组）
      - BULLETIN_SOURCE_MODE=${BULLETIN_SOURCE_MODE:-ftp}
      - BULLETIN_FTP_DIR=${BULLETIN_FTP_DIR:-/cpzz/tqgb}
      - BULLETIN_LOCAL_DIR=${BULLETIN_LOCAL_DIR:-/app/data/bulletin}
      # 业务数据根目录（容器内路径，工具代码读取）。
      # 与上面 volumes 段的挂载点一致；正常运维不需要改 .env 里的这一项。
      # dev-bj 沿用旧的 WEATHER_PICS_ROOT，未跟进 common 的 WEATHER_DATA_ROOT。
      - WEATHER_PICS_ROOT=${WEATHER_PICS_ROOT:-/app/data/weather_pics}
      # 监测预警数据接入（地面自动站报警 + 高空闪电跃增预警），与上面 volumes 段挂载点一致。
      - MONITORING_DATA_ROOT=${MONITORING_DATA_ROOT:-/app/data/alarm}
      - MONITORING_SCAN_INTERVAL_SECONDS=${MONITORING_SCAN_INTERVAL_SECONDS:-60}
      - MONITORING_INGEST_ENABLED=${MONITORING_INGEST_ENABLED:-true}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  leadsee-webui: {}
