services:
  leadsee-webui:
    # === 内网部署说明 ===
    # 构建机（有外网，Windows/Linux 均可）：
    #   docker compose build
    #   docker save leadsee-webui:local -o leadsee-webui.tar
    #   # （可选，仅 Linux 构建机）压缩可省 50%+ 体积：
    #   #   docker save leadsee-webui:local | zstd -19 > leadsee-webui.tar.zst
    # 部署机（纯内网，Ubuntu）：
    #   docker load -i leadsee-webui.tar
    #   # 若收到 .tar.zst：zstd -d leadsee-webui.tar.zst -c | docker load
    #   docker compose up -d
    # 注意：内网部署机不要执行 `docker compose build`（拉不到国内镜像源）
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CUDA: "false"
        USE_OLLAMA: "false"
        # 全部走外部 API（OpenAI 等），不需要把本地 RAG/Whisper/tiktoken 模型烘焙进镜像
        # 可省下 ~300MB 镜像体积，并避免构建期访问 huggingface.co / openaipublic.blob.core.windows.net / raw.githubusercontent.com
        USE_SLIM: "true"
    image: leadsee-webui:${WEBUI_DOCKER_TAG:-local}
    container_name: leadsee-webui
    volumes:
      - leadsee-webui:/app/backend/data
      # === 业务数据挂载 ===
      # 业务数据根目录（generate_forecast_from_folder 等工具使用）。
      # 宿主机上的数据根（默认 /data）会挂到容器内的 /pic_data。
      # 宿主机上典型结构示例：
      #   /data/ecmwf/2026053112/h500w/*.png    （容器里看到的是 /pic_data/ecmwf/...）
      #   /data/grapes/2026053112/r24/*.png
      # 工具读取路径以容器内为准（/pic_data/...），Valves 默认值由 WEATHER_DATA_ROOT 控制。
      - ${WEATHER_DATA_HOST_DIR:-/data}:/pic_data:ro
    ports:
      - ${OPEN_WEBUI_PORT:-3000}:8080
    # === 从 .env 加载完整业务配置 ===
    # 部署时把 .env.intranet.example 复制为 .env 并填写真实值
    # env_file 中的变量优先级低于下面 environment 段（compose 规则）
    env_file:
      - .env
    # === 不可被 .env 覆盖的固定配置 ===
    # 这些是基础设施级开关，不应该让 .env 误改
    environment:
      - UVICORN_WORKERS=1
      # === 容器时区（定时任务/日历提醒必需）===
      # automation_worker_loop 和 calendar_alert_worker_loop 都依赖 zoneinfo
      # 计算"墙钟时间"，容器默认 UTC 会让 "每天 9 点" 在北京时间下午 5 点才触发。
      # 镜像层已经设置过 TZ=Asia/Shanghai，这里再显式声明便于运维按需覆盖。
      - TZ=Asia/Shanghai
      # 启动 .webui_secret_key 文件的兜底逻辑由 start.sh 处理；
      # 强烈建议在 .env 里显式设置 WEBUI_SECRET_KEY（openssl rand -hex 32）
      #
      # 业务数据根目录（容器内路径，工具代码读取）。
      # 与上面 volumes 段的挂载点一致；正常运维不需要改 .env 里的这一项。
      - WEATHER_DATA_ROOT=${WEATHER_DATA_ROOT:-/pic_data}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  leadsee-webui: {}
