# ===============================================================
# 雷达推送服务（radar-push-ld）独立 compose stack。
# 与 fengche / OpenWebUI 完全解耦。
#
# 这是 radar_push_ld 工程，与 radar_push 是两套独立服务、可同时运行。
# 为避免与 radar_push 冲突，本 stack 使用独立的：
#   · 服务名 / 容器名 / 镜像名：radar-push-ld
#   · 监听端口：8771（radar_push 用 8770）
#
# 部署（在 radar_push_ld/deploy/ 目录内）：
#   1. cp .env.example .env   并填好 SFTP_PASSWORD 与 WECOM_WEBHOOK_URL
#   2. docker compose --env-file .env up -d --build
#
# 构建上下文为 ..（radar_push_ld/），Dockerfile 在 radar_push_ld/Dockerfile。
# 数据走 SFTP 远程拉取，无需挂载数据目录；仅挂载 state 持久化去重状态。
# ===============================================================

services:
  radar-push-ld:
    build:
      context: ..
      dockerfile: Dockerfile
    image: radar-push-ld:latest
    container_name: radar-push-ld
    restart: unless-stopped
    # host 网络模式：容器直接用宿主机网络栈，不依赖 docker 的 iptables 转发规则。
    # 避免 firewalld reload/restart 冲掉 docker FORWARD 规则导致容器全部断网的问题。
    # 注意：host 模式下 ports 映射失效，服务直接监听宿主机端口。
    #   Dockerfile 的 CMD 写死 8770，这里用 command 覆盖为 8771，与 radar_push 错开。
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8771"]
    env_file:
      - .env
    volumes:
      - ../state:/app/state
      # 风掣降水预报本地目录（FENGCHE_SOURCE=local）：宿主机 → 容器同路径，只读。
      - /bigdata/fengche-suzhou:/bigdata/fengche-suzhou:ro
      # 地面站点实况本地目录（OBS_SOURCE=local）：宿主机 → 容器同路径，只读。
      - /bigdata/data/aws/processed:/bigdata/data/aws/processed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8771/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
